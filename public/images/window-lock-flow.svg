<text x="668" y="172" font-size="18" fill="#6ee1e7">03</text>
<text x="668" y="205" font-size="23" font-weight="bold" fill="#f3f1e8">Windowed mode</text>
<text x="668" y="239" font-size="17" fill="#adc0d0">Windows: Alt + Enter</text>
<rect x="40" y="308" width="270" height="128" rx="10" fill="#142b41" stroke="#2f677b"/>
<text x="58" y="340" font-size="18" fill="#6ee1e7">04</text>
<text x="58" y="373" font-size="23" font-weight="bold" fill="#f3f1e8">Re-enter</text>
<text x="58" y="407" font-size="17" fill="#adc0d0">Use the same small room</text>
<text x="318" y="385" font-size="25" fill="#6ee1e7">→</text>
