<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img">
<title>Reveal the hidden window lock</title>
<rect width="960" height="540" fill="#0b1829"/>
<g font-family="Arial, sans-serif">
<text x="40" y="60" fill="#f3f1e8" font-size="30" font-weight="bold">Reveal the hidden window lock</text>
<text x="40" y="96" fill="#adc0d0" font-size="18">First complete the shared-room puzzle and collect the VHS tape.</text>
<rect x="40" y="140" width="270" height="128" rx="10" fill="#142b41" stroke="#2f677b"/>
<text x="58" y="172" font-size="18" fill="#6ee1e7">01</text>
<text x="58" y="205" font-size="23" font-weight="bold" fill="#f3f1e8">Small room</text>
<text x="58" y="239" font-size="17" fill="#adc0d0">Confirm monochrome state</text>
<text x="318" y="217" font-size="25" fill="#6ee1e7">→</text>
<rect x="345" y="140" width="270" height="128" rx="10" fill="#142b41" stroke="#2f677b"/>
<text x="363" y="172" font-size="18" fill="#6ee1e7">02</text>
<text x="363" y="205" font-size="23" font-weight="bold" fill="#f3f1e8">Leave the room</text>
<text x="363" y="239" font-size="17" fill="#adc0d0">Return to the outside</text>
<text x="623" y="217" font-size="25" fill="#6ee1e7">→</text>
